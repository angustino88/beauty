name: docs

# Builds the documentation site (docs-site/): hand-written user guides plus developer docs synced from this
# repository and from lab-mango. See docs-site/docs/developer/docs-workflow.md.
on:
  pull_request:
    paths:
      - "docs/**"
      - "README.md"
      - "docs-site/**"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "README.md"
      - "docs-site/**"
      - ".github/workflows/docs.yml"
  # Sent by lab-mango's docs-sync workflow when a backend doc changes on main.
  repository_dispatch:
    types: [backend-docs-updated]
  # Fallback in case a dispatch is missed.
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: true

jobs:
  build:
    name: Sync and build docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out frontend
        uses: actions/checkout@v4
        with:
          path: frontend

      - name: Check out lab-mango (backend docs)
        uses: actions/checkout@v4
        with:
          repository: angustino88/lab-mango
          ref: main
          token: ${{ secrets.LAB_MANGO_READ_TOKEN }}
          path: lab-mango
          sparse-checkout: |
            README.md
            AGENTS.md
            docs
            core
            packages
            .github/instructions
          # core/ is checked out whole: the sync needs the code files that docs link to.

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/docs-site/package-lock.json

      - name: Install
        working-directory: frontend/docs-site
        run: npm ci

      - name: Build (fails on broken links)
        working-directory: frontend/docs-site
        env:
          LAB_MANGO_DIR: ${{ github.workspace }}/lab-mango
          DOCS_REQUIRE_ALL: "1"
          DOCS_SITE_URL: ${{ vars.DOCS_SITE_URL || 'http://localhost:3000' }}
          DOCS_BASE_URL: ${{ vars.DOCS_BASE_URL || '/docs/' }}
        run: npm run build

      - name: Upload site
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: frontend/docs-site/build
          retention-days: 14

  publish:
    name: Publish docs
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docs-site
          path: site
      # Deployment target is not decided yet. Replace this step with the same deployment the app uses,
      # copying site/ to the host's /docs/ folder (see "Serving the site with the app" in docs-workflow.md).
      - name: Deploy
        run: |
          echo "Built $(find site -name '*.html' | wc -l) pages. Configure the deploy step to publish site/ at /docs/."
