<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
      <!-- Full light pink circular background -->
      <circle cx="250" cy="250" r="250" fill="#fce4e7" />
  
  <!-- Lock Shackle (Arch) -->
  <path d="M 207 220 V 175 A 43 43 0 0 1 293 175 V 220" 
        fill="none" 
        stroke="#db0012" 
        stroke-width="13.5" />
  
  <!-- Lock Body -->
  <rect x="175" y="220" width="150" height="102" rx="18" 
        fill="none" 
        stroke="#db0012" 
        stroke-width="13.5" />
  
  <!-- Mask/Cutout for the 'X' Circle (Matches pink background to create a gap) -->
  <circle cx="317" cy="315" r="54.5" fill="#fce4e7" />
  
  <!-- Red 'X' Circle -->
  <circle cx="317" cy="315" r="46" fill="#db0012" />
  
  <!-- White 'X' Icon -->
  <path d="M 296 294 L 338 336 M 338 294 L 296 336" 
        stroke="#ffffff" 
        stroke-width="11" 
        stroke-linecap="round" />
</svg>