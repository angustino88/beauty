# Production: the frontend image (Vite build + nginx), HTTPS.
#   docker compose -f docker-compose.prod.yml up -d --build
# The VITE_* values of .env are build arguments: rebuild after changing them.

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  nginx:
    build:
      context: .
      args:
        VITE_API_MODE: ${VITE_API_MODE:-direct}
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_ROUTER_URL: ${VITE_ROUTER_URL:-}
        VITE_CLIENT_ID: ${VITE_CLIENT_ID:?set VITE_CLIENT_ID in .env}
        VITE_TENANT_ID: ${VITE_TENANT_ID:?set VITE_TENANT_ID in .env}
        VITE_REDIRECT_URI: ${VITE_REDIRECT_URI:?set VITE_REDIRECT_URI in .env}
        VITE_APP_URL: ${VITE_APP_URL:-}
        VITE_WS_URL_CHATBOT: ${VITE_WS_URL_CHATBOT:-}
        VITE_AGENT_URL: ${VITE_AGENT_URL:-}
    image: labmango-frontend:${FRONTEND_VERSION:-latest}
    container_name: labmango_client_nginx
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_MODE: ${VITE_API_MODE:-direct}
      BACKEND_UPSTREAM: ${BACKEND_UPSTREAM:-https://host.docker.internal:8443}
      ROUTER_UPSTREAM: ${ROUTER_UPSTREAM:-https://host.docker.internal:443}
      SERVER_NAME: ${SERVER_NAME:?set SERVER_NAME in .env (e.g. labmango.com)}
      SSL_CERT_NAME: ${SSL_CERT_NAME:-labmango}
    volumes:
      - ${SSL_DIR:-./ssl_certificates}:/etc/nginx/ssl:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt: ["no-new-privileges:true"]
    logging: *logging
    restart: unless-stopped
